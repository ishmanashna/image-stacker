name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (GUI import smoke)
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Layout smoke tests
        run: python -m unittest tests.test_layout_smoke -v

      - name: Verify GUI module imports
        run: python -c "from app.gui.main import main; print('GUI import OK')"
