name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-publish-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore solution
        run: dotnet restore src/ImageStacker.sln
        shell: pwsh

      - name: Run tests
        run: dotnet test src/ImageStacker.Tests -c Release --no-restore
        shell: pwsh

      - name: Publish CLI smoke (self-contained win-x64)
        run: dotnet publish src/ImageStacker.Cli -c Release -r win-x64 --self-contained true -o dist/ci-cli
        shell: pwsh

      - name: Assert native vips DLLs in CLI publish output
        run: |
          $dlls = Get-ChildItem -Path dist/ci-cli -Filter "*.dll" | Select-Object -ExpandProperty Name
          if (-not ($dlls -match 'NetVips\.dll')) { throw "NetVips.dll not found in publish output" }
          if (-not ($dlls -match 'libvips')) { throw "libvips native DLL not found in publish output" }
          Write-Host "Native vips DLLs present: $($dlls -join ', ')"
        shell: pwsh

      - name: Publish App smoke (self-contained win-x64)
        run: dotnet publish src/ImageStacker.App -c Release -r win-x64 --self-contained true -o dist/ci-app
        shell: pwsh

      - name: Assert native vips DLLs in App publish output
        run: |
          $dlls = Get-ChildItem -Path dist/ci-app -Filter "*.dll" | Select-Object -ExpandProperty Name
          if (-not ($dlls -match 'NetVips\.dll')) { throw "NetVips.dll not found in App publish output" }
          if (-not ($dlls -match 'libvips')) { throw "libvips native DLL not found in App publish output" }
          Write-Host "App native vips DLLs present: $($dlls -join ', ')"
        shell: pwsh
